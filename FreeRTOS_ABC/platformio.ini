; PlatformIO-Projektkonfiguration – FreeRTOS-Geruest (Joystick + Ausgabe A/B/C)
;
; Drei Programme, eines pro Schritt. Auswahl in VS Code: unten in der blauen Statusleiste
; auf "env:..." klicken und das gewuenschte Programm waehlen, dann Upload.
;   env:schritt1_ohne_freertos  – Joystick + A/B/C ohne FreeRTOS (nur loop())   src/schritt1_ohne_freertos/main.cpp
;   env:schritt2_ein_task       – dasselbe als einziger FreeRTOS-Task            src/schritt2_ein_task/main.cpp
;   env:schritt3_gesamtprogramm – Joystick-Task + Master-Task + Tasks A, B, C   src/schritt3_gesamtprogramm/main.cpp
; Die Joystick-Klasse in src/ wird von allen dreien mitkompiliert.

[platformio]
default_envs = schritt3_gesamtprogramm

; ---- gemeinsame Einstellungen ----
[env]
platform = espressif32
board = esp32dev
framework = arduino
monitor_speed = 115200
; USB-Port wird automatisch erkannt. Bei Problemen hier eintragen:
;upload_port = COMx
;monitor_port = COMx

; ---- Schritt 1: ohne FreeRTOS ----
[env:schritt1_ohne_freertos]
build_src_filter = +<*> -<schritt2_ein_task/> -<schritt3_gesamtprogramm/>

; ---- Schritt 2: als einziger FreeRTOS-Task ----
[env:schritt2_ein_task]
build_src_filter = +<*> -<schritt1_ohne_freertos/> -<schritt3_gesamtprogramm/>

; ---- Schritt 3: Gesamtprogramm ----
[env:schritt3_gesamtprogramm]
build_src_filter = +<*> -<schritt1_ohne_freertos/> -<schritt2_ein_task/>
