; PlatformIO-Projektkonfiguration
; Doku: https://docs.platformio.org/page/projectconf.html
;
; Drei Programme in einem Projekt (siehe documentation/platformio.md):
;   env:aufgabe1 – Laufschrift mit Sekundenzaehler   (src/aufgabe1/main.cpp)
;   env:aufgabe2 – x/y-Koordinaten-Test (LedPanel)    (src/aufgabe2/main.cpp)
;   env:aufgabe3 – Snake-Spiel mit Joystick           (src/aufgabe3/main.cpp)
; Die Klassen in src/ (Joystick, LedPanel, Laufschrift, Snake) werden mitkompiliert.
; Auswahl in VS Code: unten in der blauen Statusleiste auf "env:..." klicken.

[platformio]
default_envs = aufgabe3

; ---- gemeinsame Einstellungen fuer alle Aufgaben ----
[env]
platform = espressif32
board = esp32dev
framework = arduino
monitor_speed = 115200
; USB-Port des ESP32: wird automatisch erkannt (CP210x/CH340), weil der Port auf jedem PC anders ist
; (Philipp: COM6, Dominika: COM3 – dort ist COM6 ein Bluetooth-Port).
; Bei Problemen hier eintragen (";" entfernen), aber nicht ins Repository committen:
;upload_port = COMx
;monitor_port = COMx

; Bibliotheken (werden von PlatformIO automatisch heruntergeladen nach .pio/libdeps/)
lib_deps =
    fastled/FastLED@3.7.8    ; feste Version: 3.10.x kompiliert nicht mit dem ESP32-Compiler von PlatformIO
    https://github.com/AaronLiddiment/LEDMatrix
    https://github.com/AaronLiddiment/LEDText

; ---- Aufgabe 1: Laufschrift ----
[env:aufgabe1]
build_src_filter = +<*> -<aufgabe2/> -<aufgabe3/>

; ---- Aufgabe 2: x/y-Koordinaten ----
[env:aufgabe2]
build_src_filter = +<*> -<aufgabe1/> -<aufgabe3/>

; ---- Aufgabe 3: Snake-Spiel ----
[env:aufgabe3]
build_src_filter = +<*> -<aufgabe1/> -<aufgabe2/>
